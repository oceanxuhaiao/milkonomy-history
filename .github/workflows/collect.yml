name: Collect Market History
on:
  schedule:
    # 每12小时采集一次，错开整点高峰
    - cron: "23 0,12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: collect
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout collector
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout gh-pages data
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
          path: site

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run collect
        working-directory: site
        run: |
          cp ../source/collect.js ../source/test.js .
          node collect.js

      - name: Validate generated data
        working-directory: site
        run: node test.js && node -e "const d=require('./history.json'); if(!d.updatedAt || !d.history || Object.keys(d.history).length < 100) process.exit(1)"

      - name: Commit and force push history.json
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json
          if git diff --cached --quiet; then
            echo "No changes, skip push"
          else
            git commit -m "chore: collect $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push --force origin gh-pages
          fi
